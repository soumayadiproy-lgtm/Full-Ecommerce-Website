<!DOCTYPE html>
<html>
<head>
<title>Cart</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #f1f3f6;
    }

    .header {
        background: linear-gradient(45deg, #ff4d4d, #ff6a00);
        color: white;
        padding: 18px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 1px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .container {
        max-width: 650px;
        margin: 40px auto;
        padding: 15px;
    }

    .item {
        background: white;
        padding: 18px;
        margin-bottom: 18px;
        border-radius: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        transition: 0.3s;
    }

    .item:hover {
        transform: translateY(-4px);
    }

    .info {
        display: flex;
        flex-direction: column;
    }

    .name {
        font-size: 18px;
        font-weight: 600;
    }

    .type {
        font-size: 13px;
        color: #777;
        margin-top: 4px;
    }

    .price {
        color: #ff4d4d;
        font-weight: bold;
        font-size: 18px;
    }

    .remove-btn {
        background: #ffe5e5;
        color: #ff4d4d;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
        margin-top: 8px;
        width: fit-content;
    }

    .remove-btn:hover {
        background: #ffcccc;
    }

    .total {
        background: white;
        padding: 20px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        margin-top: 20px;
    }

    .btn-area {
        margin-top: 25px;
        display: flex;
        justify-content: space-between;
    }

    .btn {
        padding: 12px 18px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 15px;
        transition: 0.3s;
    }

    .back {
        background: #ddd;
        color: black;
    }

    .back:hover {
        background: #ccc;
    }

    .checkout {
        background: linear-gradient(45deg, #28a745, #20c997);
        color: white;
    }

    .checkout:hover {
        opacity: 0.9;
    }
</style>
</head>

<body>

<div class="header">🛒 Your Cart</div>

<div class="container" id="cart"></div>

<div class="container">
    <div class="btn-area">
        <a href="products.html" class="btn back">⬅ Back</a>
        <a href="checkout.html" class="btn checkout">Checkout →</a>
    </div>
</div>

<script>

const BASE_URL = "http://localhost:3000";

window.onload = loadCart;

// 🔥 FIXED LOAD CART
async function loadCart() {

    const token = localStorage.getItem("token");

    if (!token) {
        document.getElementById("cart").innerHTML =
            "<h2>⚠️ Please login first</h2>";
        return;
    }

    try {

        const res = await fetch(BASE_URL + "/api/cart", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const cartData = await res.json();

        let html = "";
let total = 0;

if (!cartData.items || cartData.items.length === 0) {
    html = "<h2>No items in cart 🛒</h2>";
} else {

    cartData.items.forEach(item => {

        html += `
        <div class="item">
            <div class="info">
                <div class="name">${item.name}</div>

                <div style="margin-top:8px;">
                    <button type="button" onclick="updateQty('${item._id}','dec')">➖</button>
                    <span style="margin:0 10px;">${item.quantity}</span>
                    <button type="button" onclick="updateQty('${item._id}','inc')">➕</button>
                </div>

                <button class="remove-btn"
                    onclick="removeItem('${item._id}')">
                    Remove
                </button>
            </div>

            <div>
                <img src="${BASE_URL}${item.img}"
                     style="width:60px;height:60px;object-fit:contain;">
                <div class="price">₹${item.price * item.quantity}</div>
            </div>
        </div>
        `;

        total += item.price * item.quantity;
    });

    html += `<div class="total">Total: ₹${total}</div>`;
}
        document.getElementById("cart").innerHTML = html;

    } catch (err) {
        console.log(err);
        document.getElementById("cart").innerHTML =
            "<h2>Error loading cart ❌</h2>";
    }
}
// 🔥 REMOVE ITEM
async function removeItem(id) {

    const token = localStorage.getItem("token");

    await fetch(BASE_URL + "/api/cart/remove/" + id, {
        method: "DELETE",
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    loadCart();
}
async function updateQty(id, action) {

    const token = localStorage.getItem("token");

    try {
        const res = await fetch(BASE_URL + "/api/cart/update/" + id, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ action: action }) // ✅ IMPORTANT
        });

        const data = await res.json();
        console.log("UPDATE:", data);

        loadCart();

    } catch (err) {
        console.log("Update error:", err);
    }
}

</script>
</body>
</html>
