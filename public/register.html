<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Soumyadip Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* 🔥 Animated Gradient Background */
            background: linear-gradient(-45deg, #667eea, #764ba2, #ff6a00, #ff4d4d);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        /* Glass container */
        .container {
            width: 850px;
            height: 480px;
            display: flex;
            border-radius: 20px;
            overflow: hidden;

            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        /* LEFT SIDE */
        .left {
            width: 50%;
            padding: 40px;
            color: white;
        }

        .left h2 {
            font-size: 26px;
        }

        .left span {
            color: #ffd700;
        }

        .left p {
            margin-top: 15px;
            font-size: 14px;
        }

        /* RIGHT SIDE */
        .right {
            width: 50%;
            background: white;
            padding: 40px;
            text-align: center;
            border-top-left-radius: 40px;
            border-bottom-left-radius: 40px;
        }

        h3 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 25px;
            background: #f1f1f1;
            outline: none;
            padding-left: 15px;
        }

        input:focus {
            box-shadow: 0 0 5px #ff4d4d;
        }

        button {
            width: 95%;
            padding: 12px;
            background: linear-gradient(45deg, #ff4d4d, #ff6a00);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .link {
            margin-top: 12px;
            font-size: 13px;
        }

        .link a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: bold;
        }

        /* Small animation */
        .container:hover {
            transform: scale(1.02);
            transition: 0.3s;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left">
        <h2>Welcome to <span>Soumyadip Store</span></h2>
        <p>Shop smart. Shop fast. Shop with style.</p>

        <p>
        ✔ Premium Quality <br>
        ✔ Lightning Fast Delivery ⚡ <br>
        ✔ Best Prices Guaranteed 💰
        </p>
    </div>

    <!-- RIGHT -->
    <div class="right">
        <h3>Create Account</h3>
<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="register()">Register</button>
        <div class="link">
            Already have account? <a href="login.html">Login</a>
        </div>
    </div>

</div>
<script>
const BASE_URL = ""; // 🔥 IMPORTANT

function register() {
    console.log("CLICKED");

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("All fields required ❌");
        return;
    }

    fetch(BASE_URL + "/api/users/register", {   // ✅ FIXED
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
    })
    .then(async res => {
        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.msg || "Register failed");
        }

        return data;
    })
    .then(data => {
        // Save to local registry so account persists across serverless instances
        try {
            const raw = localStorage.getItem("registeredAccounts") || "[]";
            const accounts = JSON.parse(raw);
            const norm = email.trim().toLowerCase();
            const existingIdx = accounts.findIndex(a => a.email === norm);
            if (existingIdx >= 0) {
                accounts[existingIdx] = { email: norm, password, registeredAt: Date.now() };
            } else {
                accounts.push({ email: norm, password, registeredAt: Date.now() });
            }
            localStorage.setItem("registeredAccounts", JSON.stringify(accounts));
            localStorage.setItem("lastRegisteredEmail", norm);
        } catch (e) {}

        alert(data.msg);

        // ✅ redirect to login
        window.location.href = "login.html";
    })
    .catch(err => {
        console.error(err);
        alert(err.message || "Network error ❌");
    });
}
</script>
</body>
</html>
