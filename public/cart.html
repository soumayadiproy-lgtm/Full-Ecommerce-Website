<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Soumyadip Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
}

.header {
    background: rgba(15, 32, 39, 0.9);
    backdrop-filter: blur(15px);
    color: #00e676;
    padding: 20px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.container {
    max-width: 750px;
    margin: 30px auto;
    padding: 0 20px;
}

.cart-card {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.item {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 16px;
    margin-bottom: 16px;
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
}

.item:hover {
    background: rgba(255, 255, 255, 0.09);
    border-color: rgba(0, 230, 118, 0.3);
}

.item-left {
    display: flex;
    align-items: center;
    gap: 15px;
}

.item-img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 12px;
    background: #1e3c72;
}

.info {
    display: flex;
    flex-direction: column;
}

.name {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
}

.unit-price {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.qty-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
}

.qty-btn {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.qty-btn:hover:not(:disabled) {
    background: #00e676;
    color: #000;
    border-color: #00e676;
}

.qty-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.qty-num {
    font-size: 15px;
    font-weight: 600;
    min-width: 24px;
    text-align: center;
}

.item-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
}

.item-total-price {
    color: #00e676;
    font-weight: 700;
    font-size: 18px;
}

.remove-btn {
    background: rgba(255, 82, 82, 0.2);
    color: #ff5252;
    border: 1px solid rgba(255, 82, 82, 0.3);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: 0.3s;
}

.remove-btn:hover {
    background: #ff5252;
    color: #fff;
}

.summary-box {
    margin-top: 25px;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    padding-top: 20px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 16px;
    margin-bottom: 10px;
}

.summary-row.total-row {
    font-size: 20px;
    font-weight: 700;
    color: #00e676;
    margin-top: 15px;
}

.btn-area {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.btn {
    padding: 12px 24px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: 0.3s;
    text-align: center;
    border: none;
    cursor: pointer;
}

.btn-back {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
}

.btn-back:hover {
    background: rgba(255, 255, 255, 0.25);
}

.btn-checkout {
    background: linear-gradient(45deg, #00c853, #64dd17);
    color: #000;
    font-weight: 700;
    flex-grow: 1;
}

.btn-checkout:hover {
    transform: scale(1.02);
    box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
}

.empty-state {
    text-align: center;
    padding: 50px 20px;
}

.empty-state h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.empty-state p {
    color: #aaa;
    margin-bottom: 25px;
}

.empty-buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
}
</style>
</head>

<body>

<div class="header">🛒 Your Cart</div>

<div class="container">
    <div class="cart-card" id="cartContent">
        <div class="empty-state">
            <p>Loading your cart... ⏳</p>
        </div>
    </div>
</div>

<script>
window.onload = loadCart;

async function loadCart() {
    const token = localStorage.getItem("token");
    const container = document.getElementById("cartContent");

    if (!token) {
        container.innerHTML = `
            <div class="empty-state">
                <h2>⚠️ Authentication Required</h2>
                <p>Please login to your account to view your cart items.</p>
                <a href="login.html" class="btn btn-checkout">Login Now 🔑</a>
            </div>
        `;
        return;
    }

    try {
        const res = await fetch("/api/cart", {
            headers: { "Authorization": "Bearer " + token }
        });

        if (res.status === 401) {
            localStorage.removeItem("token");
            container.innerHTML = `
                <div class="empty-state">
                    <h2>⚠️ Session Expired</h2>
                    <p>Your session has expired. Please login again.</p>
                    <a href="login.html" class="btn btn-checkout">Login Now 🔑</a>
                </div>
            `;
            return;
        }

        const cartData = await res.json();
        const items = cartData.items || [];

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <h2>Your cart is empty 🛒</h2>
                    <p>Looks like you haven't added any products to your cart yet.</p>
                    <div class="empty-buttons">
                        <a href="grocery.html" class="btn btn-checkout">Shop Groceries 🥬</a>
                        <a href="products.html" class="btn btn-back">Browse Fashion 👕</a>
                    </div>
                </div>
            `;
            return;
        }

        let html = "";
        let subtotal = 0;

        items.forEach(item => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;

            html += `
            <div class="item">
                <div class="item-left">
                    <img src="${item.img || 'https://via.placeholder.com/100'}" class="item-img" alt="${item.name}">
                    <div class="info">
                        <div class="name">${item.name}</div>
                        <div class="unit-price">₹${item.price} per unit</div>
                        <div class="qty-controls">
                            <button class="qty-btn" ${item.quantity <= 1 ? 'disabled' : ''} onclick="updateQty('${item._id}', 'dec')">➖</button>
                            <span class="qty-num">${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty('${item._id}', 'inc')">➕</button>
                        </div>
                    </div>
                </div>

                <div class="item-right">
                    <div class="item-total-price">₹${itemTotal}</div>
                    <button class="remove-btn" onclick="removeItem('${item._id}')">🗑️ Remove</button>
                </div>
            </div>
            `;
        });

        html += `
            <div class="summary-box">
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹${subtotal}</span>
                </div>
                <div class="summary-row">
                    <span>Delivery</span>
                    <span style="color:#64dd17;">FREE</span>
                </div>
                <div class="summary-row total-row">
                    <span>Total Amount</span>
                    <span>₹${subtotal}</span>
                </div>
            </div>

            <div class="btn-area">
                <a href="grocery.html" class="btn btn-back">⬅ Continue Shopping</a>
                <a href="checkout.html" class="btn btn-checkout">Proceed to Checkout →</a>
            </div>
        `;

        container.innerHTML = html;

    } catch (err) {
        console.error("Cart error:", err);
        container.innerHTML = `
            <div class="empty-state">
                <h2>Error Loading Cart ❌</h2>
                <p>Could not fetch your cart items. Please try again.</p>
                <button onclick="loadCart()" class="btn btn-back">Retry 🔄</button>
            </div>
        `;
    }
}

// UPDATE QUANTITY
async function updateQty(id, action) {
    const token = localStorage.getItem("token");

    try {
        const res = await fetch("/api/cart/update/" + id, {
            method: "PUT",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({ action })
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || data.error || "Failed to update quantity ❌");
            return;
        }

        loadCart();

    } catch (err) {
        console.error("Update error:", err);
        alert("Server error updating quantity ❌");
    }
}

// REMOVE ITEM
async function removeItem(id) {
    const token = localStorage.getItem("token");

    try {
        const res = await fetch("/api/cart/remove/" + id, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });

        const data = await res.json();

        if (!res.ok) {
            alert(data.message || data.error || "Failed to remove item ❌");
            return;
        }

        loadCart();

    } catch (err) {
        console.error("Remove error:", err);
        alert("Server error removing item ❌");
    }
}
</script>
</body>
</html>
