<!DOCTYPE html>
<html>
<head>
<title>My Account</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;   /* ✅ FIX */
    display: flex;
}
/* SIDEBAR */
.sidebar {
    width: 220px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(10px);
    color: white;
    padding: 20px;
}

.sidebar h2 {
    text-align: center;
}

.menu-item {
    padding: 12px;
    margin: 10px 0;
    cursor: pointer;
    border-radius: 8px;
}

.menu-item:hover {
    background: rgba(255,255,255,0.2);
}

/* MAIN */
.main {
    flex: 1;
    padding: 30px;
    color: white;
}

.card {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 15px;
    width: 400px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: #ff6a00;
    color: white;
    cursor: pointer;
}

.hidden {
    display: none;
}

.order-box {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
}
/* 🔥 RESPONSIVE FIX (CLEAN VERSION) */

/* Tablet */
@media (max-width:900px){
    .card{
        width: 100%;
        max-width: 500px;
        margin: auto;
    }

    .main{
        padding: 20px;
    }
}

/* Mobile */
/* 🔥 FINAL RESPONSIVE FIX */

@media (max-width:768px){

    body{
        flex-direction: column;   /* stack */
    }

    .sidebar{
        width: 100%;
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 10px;
    }

    .sidebar h2{
        display: none;
    }

    .menu-item{
        margin: 0;
        padding: 8px;
        font-size: 14px;
    }

    .main{
        padding: 15px;
    }

    .card{
        width: 100%;
        max-width: 100%;
    }
}
/* Small mobile */
@media (max-width:450px){

    .sidebar{
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
    }

    .menu-item{
        font-size: 12px;
        padding: 5px;
    }

    input{
        padding: 8px;
        font-size: 13px;
    }

    button{
        padding: 8px;
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="sidebar">
    <h2>My Account</h2>

    <div class="menu-item" onclick="showSection('profile')">👤 Profile</div>
    <div class="menu-item" onclick="showSection('address')">📍 Address</div>
    <div class="menu-item" onclick="showSection('orders')">📦 Orders</div>
    <div class="menu-item" onclick="logout()">🚪 Logout</div>
</div>

<div class="main">

    <!-- PROFILE -->
    <div id="profile" class="card">
        <h3>Profile 👤</h3>
        <input id="email" placeholder="Email" disabled>
        <input id="name" placeholder="Name">
        <input id="phone" placeholder="Phone">
        <button onclick="updateProfile()">Update</button>
        <button id="premiumBtn" onclick="upgrade()">Buy Premium Plus 💎</button>
    </div>

    <!-- ADDRESS -->
    <div id="address" class="card hidden">
        <h3>Address 📍</h3>
        <input id="addressInput" placeholder="Address">
        <input id="city" placeholder="City">
        <input id="pincode" placeholder="Pincode">
        <button onclick="updateProfile()">Save Address</button>
    </div>

    <!-- ORDERS -->
    <div id="orders" class="card hidden">
        <h3>My Orders 📦</h3>
        <div id="orderList">Loading...</div>
    </div>

</div>

<script>
const BASE_URL = "";
const token = localStorage.getItem("token");
// 🔐 LOGIN CHECK
if (!token) {
    alert("Login required ❌");
    window.location.href = "/login.html";
}

// 🔥 SWITCH MENU
function showSection(section) {
    document.getElementById("profile").classList.add("hidden");
    document.getElementById("address").classList.add("hidden");
    document.getElementById("orders").classList.add("hidden");

    document.getElementById(section).classList.remove("hidden");
}

// 🔥 LOAD PROFILE
async function loadProfile() {
    const res = await fetch(BASE_URL + "/api/users/profile", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const user = await res.json();

    document.getElementById("email").value = user.email || "";
    document.getElementById("name").value = user.name || "";
    document.getElementById("phone").value = user.phone || "";
    document.getElementById("addressInput").value = user.address || "";
    document.getElementById("city").value = user.city || "";
    document.getElementById("pincode").value = user.pincode || "";

    // 👑 FIXED POSITION
    if (user.membership === "premium_plus") {
        const btn = document.getElementById("premiumBtn");
        btn.innerText = "You are Premium 👑";
        btn.disabled = true;
    }
}
// 🔥 LOAD ORDERS
async function loadOrders() {
   const res = await fetch(BASE_URL + "/api/orders", {
        headers: {
            "Authorization": "Bearer " + token
        }
    });

    const data = await res.json();
    const box = document.getElementById("orderList");

    if (!data.length) {
        box.innerHTML = "No orders yet 😅";
        return;
    }

    box.innerHTML = data.map(o => `
        <div class="order-box" style="
            background: rgba(255,255,255,0.15);
            padding: 20px;
            margin-top: 15px;
            border-radius: 15px;
        ">
            <h4>Order #${o._id}</h4>
            <p>${new Date(o.createdAt).toLocaleString()}</p>

            ${o.items.map(item => `
                <p>🛍 ${item.name} - ₹${item.price}</p>
            `).join("")}

            <hr>

            <b>Total: ₹${o.total}</b>

            <div style="
                margin-top:10px;
                background: orange;
                display:inline-block;
                padding:5px 10px;
                border-radius:20px;
            ">
                ${o.status || "Pending"}
            </div>
        </div>
    `).join("");
}
// 🔥 UPDATE PROFILE
async function updateProfile() {

    const res = await fetch(BASE_URL + "/api/users/profile", {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            name: document.getElementById("name").value,
            phone: document.getElementById("phone").value,
            address: document.getElementById("addressInput").value,
            city: document.getElementById("city").value,
            pincode: document.getElementById("pincode").value
        })
    });

    const data = await res.json();
    alert(data.msg || "Updated ✅");
}

// 🔥 LOGOUT
function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login.html";
}
// 💎 PREMIUM UPGRADE
async function upgrade() {

    try {
        const orderRes = await fetch(BASE_URL + "/api/payment/create-order", {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const order = await orderRes.json();
        console.log("ORDER:", order);

        const options = {
           key: "rzp_test_abc123xxxx" ,
            amount: order.amount,
            currency: "INR",
            name: "My Store",
            description: "Premium Plus",
            order_id: order.id,

            handler: async function (response) {
                const res = await fetch(BASE_URL + "/api/payment/verify-payment", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        paymentId: response.razorpay_payment_id
                    })
                });

                const data = await res.json();
                alert(data.message);
                loadProfile();
            }
        };

        const rzp = new Razorpay(options);

        // ❗ ADD THIS
        rzp.on("payment.failed", function (response) {
            console.log("FAIL:", response.error);
            alert("Payment Failed ❌");
        });

        rzp.open();

    } catch (err) {
        console.log("ERROR:", err);
        alert("Something went wrong ❌");
    }
}
// INIT
loadProfile();
loadOrders();

</script>

</body>
</html>
