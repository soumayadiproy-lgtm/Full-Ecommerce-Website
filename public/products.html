<!DOCTYPE html>
<html>
<head>
<title>Soumyadip Store</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #e6b3b3;
}

/* 🔴 NAVBAR */
.navbar {
    background: linear-gradient(45deg, #ff1a1a, #ff4d4d);
    padding: 18px;
    display: flex;
    justify-content: center;
    gap: 40px;
}

.navbar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* 🛒 TITLE */
h1 {
    text-align: center;
    margin-top: 20px;
}

/* 🔍 SEARCH */
.search-box {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 20px;
}

.search-box input {
    padding: 10px;
    width: 250px;
    border-radius: 8px;
    border: none;
}

.search-box select {
    padding: 10px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}
/* 📦 GRID */
.box {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 30px;
    padding: 20px;
}

/* 🧾 CARD */
.card {
    background: #f2f2f2;
    padding: 20px;
    width: 220px;
    border-radius: 15px;
    text-align: center;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* 🖼 IMAGE */
.card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
}

/* 💰 PRICE */
.price {
    margin: 10px 0;
    font-weight: bold;
}

/* 🔘 BUTTON */
.add-btn {
    background: red;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
}

.add-btn:disabled {
    background: #999;
}

/* ❤️ WISHLIST */
.wishlist-btn {
    background: white;
    color: red;
    border: 1px solid red;
    padding: 6px 10px;
    border-radius: 6px;
    margin-top: 5px;
    cursor: pointer;
}

.wishlist-btn.active {
    background: red;
    color: white;
}

/* 🛒 ANIMATION */
.fly {
    position: fixed;
    width: 40px;
    height: 40px;
    z-index: 999;
    transition: all 0.8s ease;
    border-radius: 50%;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="grocery.html">Grocery 🥬</a>
    <a href="cart.html">Cart 🛒 (<span id="cartCount">0</span>)</a>
    <a href="orders.html">My Orders 🧾</a>
    <a href="login.html">Login</a>
    <a href="admin/dashboard.html" id="adminLink" style="display:none;">Admin 👑</a>
</div>

<h1>🛒 Soumyadip Store</h1>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search..." onkeyup="searchProducts()">
  <select id="categorySelect" onchange="loadProducts(this.value)">
        <option value="">All</option>
        <option value="shoes">Shoes</option>
        <option value="clothes">Clothes</option>
        <option value="electronics">Electronics</option>
    </select>
</div>

<!-- 📦 PRODUCTS -->
<div class="box" id="productList"></div>

<script>
const BASE_URL = "";
// 👑 ADD HERE
function getUserRole() {
    const token = localStorage.getItem("token");
    if (!token) return null;

    try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        return payload.role;
    } catch {
        return null;
    }
}
let currentType = ""; // 🔥 store selected category

window.onload = function () {
    loadProducts();
    loadCartCount();
    // 👑 ADMIN CHECK
    const role = getUserRole();

    if (role === "admin") {
        document.getElementById("adminLink").style.display = "inline";
    }
};
// PRODUCT PAGE
function goProduct(id) {
    window.location.href = "product1.html?id=" + id;
}

// LOAD PRODUCTS
async function loadProducts(type = "") {

    // 🔥 STORE TYPE
    currentType = type;

    let url = BASE_URL + "/api/products";
    if (type) url += "?type=" + type;

    const res = await fetch(url);
    const data = await res.json();
// 🔥 REMOVE GROCERY FROM MAIN PRODUCTS PAGE
const filteredData = data.filter(p => p.category !== "grocery");
    let html = "";

    filteredData.forEach(p => {
        html += `
<div class="card" onclick="goProduct('${p._id}')">
    <img src="${BASE_URL}${p.img}">
    <h3>${p.name}</h3>
    <div class="price">₹${p.price}</div>

    <button class="add-btn" data-id="${p._id}" onclick="event.stopPropagation()">Add 🛒</button>
    <button class="wishlist-btn" data-id="${p._id}" onclick="event.stopPropagation()">❤️ Wishlist</button>
</div>`;
    });

    document.getElementById("productList").innerHTML = html;

    setupButtons();
}

// BUTTON SETUP
function setupButtons() {
    const token = localStorage.getItem("token");

    document.querySelectorAll(".add-btn").forEach(btn => {
        const id = btn.dataset.id;

        if (!token) {
            btn.innerText = "Login first";
            btn.disabled = true;
        }

        btn.onclick = (e) => {
            e.stopPropagation();

            if (!token) {
                alert("⚠️ Please login first!");
                return;
            }

            addToCart(id, btn);
        };
    });

    // ❤️ WISHLIST
    document.querySelectorAll(".wishlist-btn").forEach(btn => {
        const id = btn.dataset.id;

        btn.onclick = (e) => {
            e.stopPropagation();

            let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

            if (wishlist.includes(id)) {
                wishlist = wishlist.filter(i => i !== id);
                btn.classList.remove("active");
                btn.innerText = "❤️ Wishlist";
            } else {
                wishlist.push(id);
                btn.classList.add("active");
                btn.innerText = "💖 Added";
            }

            localStorage.setItem("wishlist", JSON.stringify(wishlist));
        };
    });
}

// ADD TO CART
function addToCart(id, btn) {
    const token = localStorage.getItem("token");

    const img = btn.parentElement.querySelector("img");
    const cart = document.getElementById("cartCount");

    const fly = img.cloneNode(true);
    fly.classList.add("fly");

    const rect = img.getBoundingClientRect();
    fly.style.left = rect.left + "px";
    fly.style.top = rect.top + "px";

    document.body.appendChild(fly);

    const cartRect = cart.getBoundingClientRect();

    setTimeout(() => {
        fly.style.left = cartRect.left + "px";
        fly.style.top = cartRect.top + "px";
        fly.style.width = "10px";
        fly.style.height = "10px";
        fly.style.opacity = 0.3;
    }, 50);

    setTimeout(() => fly.remove(), 800);

    fetch(BASE_URL + "/api/cart/add", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({ productId: id })
    })
    .then(res => res.json())
    .then(() => {
        btn.innerText = "Added ✅";
        btn.style.background = "green";
        btn.disabled = true;
        loadCartCount();
    });
}

// CART COUNT
async function loadCartCount() {
    const token = localStorage.getItem("token");
    if (!token) return;

    try {
        const res = await fetch(BASE_URL + "/api/cart", {
            headers: { "Authorization": "Bearer " + token }
        });

        const data = await res.json();

        const items = data.items || [];

        let count = 0;

        items.forEach(item => {
            count += item.quantity;
        });

        document.getElementById("cartCount").innerText = count;

    } catch (err) {
        console.log(err);
    }
}

// SEARCH (FIXED WITH CATEGORY)
function searchProducts() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        const name = card.querySelector("h3").innerText.toLowerCase();
        card.style.display = name.includes(input) ? "block" : "none";
    });
}
</script>

</body>
</html>
