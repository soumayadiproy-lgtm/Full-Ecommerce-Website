<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout</title>
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 350px;
            color: white;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .container img {
            width: 100px;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 25px;
            background: #ff4b5c;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff1e38;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 🔥 Add your image here -->
    <img src="images/ChatGPT Image Mar 28, 2026, 04_17_43 AM.jpg" alt="logout">

    <h2>You are Logged Out</h2>
    <p>Thanks for visiting Soumyadip Store 💙</p>

    <a href="login.html">
        <button>Login Again</button>
    </a>
</div>
<script>
    // 🔥 LOGOUT FUNCTION
    function logoutUser() {
        // Remove token from browser
        localStorage.removeItem("token");

        // Optional: remove user data if you stored
        localStorage.removeItem("user");
    }

    // Auto logout when page loads
    logoutUser();
</script>
</body>
</html>
