<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Soumyadip Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: #0a0a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Animated Background ── */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat 8s ease-in-out infinite;
    }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, #4f46e5 0%, transparent 70%); top: -200px; left: -150px; animation-delay: 0s; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, #db2777 0%, transparent 70%); bottom: -150px; right: -100px; animation-delay: 3s; }
    .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, #0ea5e9 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: 1.5s; }

    @keyframes orbFloat {
      0%, 100% { transform: scale(1) translateY(0); }
      50%       { transform: scale(1.1) translateY(-20px); }
    }

    /* ── Grid Pattern ── */
    .grid-pattern {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Login Card ── */
    .login-card {
      position: relative;
      z-index: 10;
      width: 420px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 48px 40px;
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Logo / Icon ── */
    .admin-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5, #db2777);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 24px;
      box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
      animation: badgePulse 2.5s ease-in-out infinite;
    }

    @keyframes badgePulse {
      0%, 100% { box-shadow: 0 10px 30px rgba(79,70,229,0.4); }
      50%       { box-shadow: 0 10px 45px rgba(219,39,119,0.6); }
    }

    .login-title {
      text-align: center;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      margin-bottom: 36px;
    }

    /* ── Access Label ── */
    .access-label {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(79,70,229,0.15);
      border: 1px solid rgba(79,70,229,0.3);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 28px;
      font-size: 12.5px;
      color: #a5b4fc;
    }

    .access-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: blink 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Input Fields ── */
    .field {
      position: relative;
      margin-bottom: 18px;
    }

    .field-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 15px;
      pointer-events: none;
      transition: color 0.2s;
    }

    .field input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .field input::placeholder { color: rgba(255,255,255,0.3); }

    .field input:focus {
      border-color: rgba(79,70,229,0.6);
      background: rgba(79,70,229,0.08);
      box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
    }

    .field input:focus + .field-icon { color: #818cf8; }

    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      font-size: 15px;
      transition: color 0.2s;
    }
    .toggle-pwd:hover { color: rgba(255,255,255,0.7); }

    /* ── Error / Success Message ── */
    .msg-box {
      display: none;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }

    .msg-error {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
    }

    .msg-success {
      background: rgba(74,222,128,0.15);
      border: 1px solid rgba(74,222,128,0.3);
      color: #86efac;
    }

    @keyframes fadeIn { from {opacity:0;transform:translateY(-8px);} to {opacity:1;transform:translateY(0);} }

    /* ── Login Button ── */
    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4f46e5, #db2777);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 25px rgba(79,70,229,0.4);
      letter-spacing: 0.3px;
      margin-top: 4px;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(79,70,229,0.55);
    }

    .login-btn:active { transform: translateY(0); }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.75;
    }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .login-footer {
      text-align: center;
      margin-top: 28px;
      color: rgba(255,255,255,0.25);
      font-size: 12px;
    }

    .login-footer a {
      color: #818cf8;
      text-decoration: none;
    }

    .login-footer a:hover { text-decoration: underline; }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .login-card { width: calc(100vw - 32px); padding: 36px 24px; }
    }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="grid-pattern"></div>

<!-- Login Card -->
<div class="login-card">

  <div class="admin-badge">👑</div>

  <h1 class="login-title">Admin Portal</h1>
  <p class="login-subtitle">Soumyadip Store — Restricted Access</p>

  <div class="access-label">
    <span class="access-dot"></span>
    This area is restricted to administrators only
  </div>

  <!-- Error / Success -->
  <div class="msg-box msg-error" id="errorMsg"></div>
  <div class="msg-box msg-success" id="successMsg"></div>

  <!-- Form -->
  <form id="adminLoginForm" onsubmit="handleLogin(event)">

    <div class="field">
      <i class="fa fa-envelope field-icon"></i>
      <input type="email" id="adminEmail" placeholder="Admin Email" required autocomplete="username" />
    </div>

    <div class="field">
      <i class="fa fa-lock field-icon"></i>
      <input type="password" id="adminPassword" placeholder="Admin Password" required autocomplete="current-password" />
      <i class="fa fa-eye toggle-pwd" id="togglePwd" onclick="togglePassword()"></i>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      <span id="btnText">🔐 Sign In as Admin</span>
      <div class="spinner" id="spinner"></div>
    </button>

  </form>

  <div class="login-footer">
    <a href="/index.html">← Back to Store</a> &nbsp;|&nbsp;
    Not an admin? <a href="/login.html">User Login</a>
  </div>

</div>

<script>
  // ── Redirect if already admin-logged in ──
  (function() {
    const token = localStorage.getItem("adminToken") || localStorage.getItem("token");
    if (token) {
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        if (payload.role === "admin" && payload.exp * 1000 > Date.now()) {
          window.location.replace("/admin/dashboard.html");
          return;
        }
      } catch {}
    }
  })();

  function showMsg(type, text) {
    const errEl = document.getElementById("errorMsg");
    const succEl = document.getElementById("successMsg");
    errEl.style.display = "none";
    succEl.style.display = "none";

    if (type === "error") {
      errEl.textContent = text;
      errEl.style.display = "block";
    } else {
      succEl.textContent = text;
      succEl.style.display = "block";
    }
  }

  function setLoading(on) {
    const btn = document.getElementById("loginBtn");
    const text = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");
    if (on) {
      btn.classList.add("loading");
      text.style.display = "none";
      spinner.style.display = "block";
    } else {
      btn.classList.remove("loading");
      text.style.display = "block";
      spinner.style.display = "none";
    }
  }

  function togglePassword() {
    const pwd = document.getElementById("adminPassword");
    const icon = document.getElementById("togglePwd");
    if (pwd.type === "password") {
      pwd.type = "text";
      icon.classList.replace("fa-eye", "fa-eye-slash");
    } else {
      pwd.type = "password";
      icon.classList.replace("fa-eye-slash", "fa-eye");
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("adminEmail").value.trim();
    const password = document.getElementById("adminPassword").value;

    if (!email || !password) {
      showMsg("error", "⚠️ Please fill in all fields.");
      return;
    }

    setLoading(true);

    try {
      const res = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showMsg("error", data.msg || "❌ Login failed. Check your credentials.");
        setLoading(false);
        return;
      }

      // ✅ Save admin token
      localStorage.setItem("adminToken", data.token);
      localStorage.setItem("token", data.token);      // for existing admin pages
      localStorage.setItem("adminEmail", data.user.email);
      localStorage.setItem("adminRole", "admin");
      localStorage.setItem("user", JSON.stringify(data.user));

      showMsg("success", "✅ Login successful! Redirecting to dashboard...");

      setTimeout(() => {
        window.location.replace("/admin/dashboard.html");
      }, 900);

    } catch (err) {
      showMsg("error", "⚠️ Network error. Please try again.");
      setLoading(false);
    }
  }

  // Enter to submit
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") document.getElementById("adminLoginForm").requestSubmit();
  });
</script>

</body>
</html>
