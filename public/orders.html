<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Soumyadip Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: white;
    min-height: 100vh;
}

.header {
    background: rgba(15, 32, 39, 0.9);
    backdrop-filter: blur(15px);
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.header h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: #00e676;
}

.nav-links a {
    color: #e0e0e0;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    margin-left: 20px;
    transition: 0.3s;
}

.nav-links a:hover {
    color: #00e676;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 0 20px 40px;
}

.card {
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: 0.3s;
}

.card:hover {
    border-color: rgba(0, 230, 118, 0.3);
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 15px;
    margin-bottom: 15px;
}

.order-id {
    font-weight: 700;
    font-size: 17px;
    color: #fff;
}

.date {
    font-size: 13px;
    color: #aaa;
    margin-top: 4px;
}

.payment-badge {
    font-size: 12px;
    background: rgba(255, 255, 255, 0.1);
    padding: 4px 10px;
    border-radius: 12px;
    display: inline-block;
    margin-top: 6px;
    text-transform: uppercase;
    font-weight: 600;
}

.status {
    padding: 6px 16px;
    border-radius: 30px;
    font-size: 13px;
    font-weight: 700;
    text-transform: capitalize;
}

.status-placed, .status-confirmed, .status-ordered {
    background: rgba(33, 150, 243, 0.2);
    color: #64b5f6;
    border: 1px solid rgba(33, 150, 243, 0.4);
}

.status-pending {
    background: rgba(255, 193, 7, 0.2);
    color: #ffd54f;
    border: 1px solid rgba(255, 193, 7, 0.4);
}

.status-processing {
    background: rgba(156, 39, 176, 0.2);
    color: #ba68c8;
    border: 1px solid rgba(156, 39, 176, 0.4);
}

.status-shipped, .status-outfordelivery {
    background: rgba(0, 188, 212, 0.2);
    color: #4dd0e1;
    border: 1px solid rgba(0, 188, 212, 0.4);
}

.status-delivered {
    background: rgba(76, 175, 80, 0.2);
    color: #81c784;
    border: 1px solid rgba(76, 175, 80, 0.4);
}

.status-cancelled {
    background: rgba(244, 67, 54, 0.2);
    color: #e57373;
    border: 1px solid rgba(244, 67, 54, 0.4);
}

.items {
    margin-bottom: 15px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.item-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.item-img {
    width: 45px;
    height: 45px;
    border-radius: 8px;
    object-fit: cover;
    background: #1e3c72;
}

.item-name {
    font-size: 15px;
    font-weight: 500;
}

.item-qty {
    font-size: 13px;
    color: #aaa;
}

.item-price {
    font-weight: 600;
    color: #00e676;
}

.bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 15px;
    margin-top: 10px;
}

.total-amount {
    font-size: 18px;
    font-weight: 700;
    color: #00e676;
}

.delete-btn {
    background: rgba(255, 82, 82, 0.15);
    color: #ff5252;
    border: 1px solid rgba(255, 82, 82, 0.3);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.delete-btn:hover {
    background: #ff5252;
    color: white;
}

.state-msg {
    text-align: center;
    padding: 60px 20px;
}

.state-msg h2 {
    font-size: 24px;
    margin-bottom: 10px;
}

.state-msg p {
    color: #aaa;
    margin-bottom: 25px;
}

.btn-shop {
    display: inline-block;
    background: linear-gradient(45deg, #00c853, #64dd17);
    color: #000;
    padding: 12px 24px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s;
}

.btn-shop:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<header class="header">
    <h2>🧾 My Orders</h2>
    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="grocery.html">Grocery</a>
        <a href="products.html">Fashion</a>
        <a href="cart.html">Cart</a>
    </div>
</header>

<div class="container" id="ordersContainer">
    <div class="state-msg">
        <h2>Loading your orders... ⏳</h2>
    </div>
</div>

<script>
window.onload = loadOrders;

async function loadOrders() {
    const token = localStorage.getItem("token");
    const container = document.getElementById("ordersContainer");

    if (!token) {
        container.innerHTML = `
            <div class="state-msg">
                <h2>⚠️ Authentication Required</h2>
                <p>Please login to view your order history.</p>
                <a href="login.html" class="btn-shop">Login Now 🔑</a>
            </div>
        `;
        return;
    }

    try {
        const res = await fetch("/api/orders", {
            headers: { "Authorization": "Bearer " + token }
        });

        if (res.status === 401) {
            localStorage.removeItem("token");
            container.innerHTML = `
                <div class="state-msg">
                    <h2>⚠️ Session Expired</h2>
                    <p>Please login again to access your orders.</p>
                    <a href="login.html" class="btn-shop">Login Now 🔑</a>
                </div>
            `;
            return;
        }

        if (!res.ok) {
            container.innerHTML = `
                <div class="state-msg">
                    <h2>Server Error ❌</h2>
                    <p>Failed to load orders. Please try again later.</p>
                </div>
            `;
            return;
        }

        const orders = await res.json();

        if (!orders || orders.length === 0) {
            container.innerHTML = `
                <div class="state-msg">
                    <h2>You have no orders yet 🛍️</h2>
                    <p>Place your first grocery or fashion order today!</p>
                    <a href="grocery.html" class="btn-shop">Shop Groceries Now 🥬</a>
                </div>
            `;
            return;
        }

        let html = "";

        orders.forEach(order => {
            const orderDate = order.createdAt 
                ? new Date(order.createdAt).toLocaleString("en-IN", {
                    dateStyle: "medium",
                    timeStyle: "short"
                  })
                : "Recent Order";

            html += `
            <div class="card">
                <div class="top">
                    <div>
                        <div class="order-id">Order #${order._id}</div>
                        <div class="date">📅 ${orderDate}</div>
                        <div class="payment-badge">💳 Method: ${(order.payment || 'COD').toUpperCase()}</div>
                    </div>
                    ${renderStatusBadge(order.status)}
                </div>

                <div class="items">
            `;

            if (order.items && order.items.length > 0) {
                order.items.forEach(item => {
                    const qty = item.quantity || 1;
                    const price = item.price || 0;
                    html += `
                    <div class="item">
                        <div class="item-left">
                            <img src="${item.img || 'https://via.placeholder.com/45'}" class="item-img" alt="${item.name}">
                            <div>
                                <div class="item-name">${item.name}</div>
                                <div class="item-qty">Qty: ${qty} × ₹${price}</div>
                            </div>
                        </div>
                        <div class="item-price">₹${price * qty}</div>
                    </div>
                    `;
                });
            } else {
                html += `<div class="item">No item details</div>`;
            }

            html += `
                </div>

                <div class="bottom-row">
                    <div class="total-amount">Total: ₹${order.total || 0}</div>
                    <button class="delete-btn" onclick="deleteOrder('${order._id}')">❌ Cancel / Delete</button>
                </div>
            </div>
            `;
        });

        container.innerHTML = html;

    } catch (err) {
        console.error("Order load error:", err);
        container.innerHTML = `
            <div class="state-msg">
                <h2>Error Loading Orders ❌</h2>
                <p>Could not fetch your order history.</p>
            </div>
        `;
    }
}

function renderStatusBadge(status) {
    const s = (status || "Placed").toLowerCase().replace(/\s+/g, '');
    let statusClass = "status-placed";
    let icon = "📦";

    if (s.includes("pending")) {
        statusClass = "status-pending"; icon = "🕒";
    } else if (s.includes("processing")) {
        statusClass = "status-processing"; icon = "⚙️";
    } else if (s.includes("shipped") || s.includes("outfordelivery")) {
        statusClass = "status-shipped"; icon = "🚚";
    } else if (s.includes("delivered")) {
        statusClass = "status-delivered"; icon = "✅";
    } else if (s.includes("cancelled")) {
        statusClass = "status-cancelled"; icon = "❌";
    } else if (s.includes("confirmed") || s.includes("placed") || s.includes("ordered")) {
        statusClass = "status-placed"; icon = "🎉";
    }

    return `<div class="status ${statusClass}">${icon} ${status || 'Placed'}</div>`;
}

async function deleteOrder(id) {
    if (!confirm("Are you sure you want to delete this order record?")) return;

    const token = localStorage.getItem("token");

    try {
        const res = await fetch("/api/orders/" + id, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + token }
        });

        const data = await res.json();
        if (!res.ok) {
            alert(data.error || "Failed to delete order ❌");
            return;
        }

        loadOrders();

    } catch (err) {
        console.error("Delete error:", err);
        alert("Server error deleting order ❌");
    }
}
</script>
</body>
</html>
