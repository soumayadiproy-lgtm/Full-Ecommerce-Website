<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f1f3f6;
}

/* HEADER */
.header {
    background: linear-gradient(45deg, #ff4d4d, #ff6a00);
    color: white;
    padding: 20px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* PROFILE */
.profile {
    text-align: center;
    padding: 20px;
}

.profile img {
    width: 80px;
    border-radius: 50%;
}

.profile h3 {
    margin: 10px 0 5px;
}

.profile p {
    color: gray;
    font-size: 14px;
}

/* MENU GRID */
.menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    padding: 20px;
}

/* CARD */
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    cursor: pointer;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.icon {
    font-size: 30px;
}

.card h4 {
    margin-top: 10px;
}

/* LOGOUT */
.logout {
    margin: 20px;
    text-align: center;
}

.logout button {
    padding: 12px 20px;
    background: #ff4d4d;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="header">📋 Dashboard</div>

<!-- 👤 PROFILE -->
<div class="profile">
    <img src="images/ChatGPT Image Mar 28, 2026, 04_17_43 AM.jpg">
    <h3>Soumyadip Store</h3>
    <p>Welcome back 👋</p>
</div>

<!-- 🔥 MENU -->
<div class="menu-grid">

    <div class="card" onclick="go('index.html')">
        <div class="icon">🏠</div>
        <h4>Home</h4>
    </div>
    
    <div class="card" onclick="go('account.html')">
        <div class="icon">🏠</div>
        <h4>My Account</h4>
    </div>

    <div class="card" onclick="go('products.html')">
        <div class="icon">🛍️</div>
        <h4>Products</h4>
    </div>

    <div class="card" onclick="go('cart.html')">
        <div class="icon">🛒</div>
        <h4>Cart</h4>
    </div>

    <div class="card" onclick="go('checkout.html')">
        <div class="icon">💳</div>
        <h4>Checkout</h4>
    </div>

    <div class="card" onclick="go('orders.html')">
        <div class="icon">📜</div>
        <h4>Orders</h4>
    </div>


</div>

<!-- 🚪 LOGOUT -->
<div class="logout">
    <button onclick="go('index.html')">Logout</button>
</div>

<script>
function go(page) {
    window.location.href = page;
}
</script>

</body>
</html>
