<!DOCTYPE html>
<html>

<head>
    <title>Contact - Soumyadip Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* 🔥 Premium gradient */
            background: linear-gradient(135deg, #667eea, #764ba2, #ff6a00);
            background-size: 400% 400%;
            animation: bgMove 10s infinite;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes bgMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* 💎 Glass container */
        .container {
            width: 850px;
            display: flex;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* LEFT SIDE */
        .left {
            width: 45%;
            padding: 40px;
            color: white;
        }

        .left h2 {
            margin: 0;
            font-size: 28px;
        }

        .left p {
            margin-top: 15px;
            font-size: 14px;
        }

        /* RIGHT SIDE */
        .right {
            width: 55%;
            background: white;
            padding: 40px;
            border-top-left-radius: 40px;
            border-bottom-left-radius: 40px;
            text-align: center;
        }

        h3 {
            margin-bottom: 20px;
        }

        input,
        textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 25px;
            border: none;
            background: #f1f1f1;
            outline: none;
        }

        textarea {
            border-radius: 15px;
        }

        input:focus,
        textarea:focus {
            box-shadow: 0 0 5px #ff4d4d;
        }

        button {
            width: 95%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(45deg, #ff4d4d, #ff6a00);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT -->
        <div class="left">
            <h2>Contact Soumyadip Store</h2>
            <p>We are here to help you anytime 💬</p>

            <p>
                📧 Email: support@soumyadiproy037@gmail.com <br>
                📞 Phone: +91 98xxxxxxxx <br>
                📍 India
            </p>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <h3>Send Message</h3>

            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea rows="4" placeholder="Your Message"></textarea>
                <button type="submit">Send</button>
            </form>

            <a href="index.html" class="back">⬅ Back to Home</a>
        </div>

    </div>
    <script>
        async function sendMessage() {

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            await fetch("/api/contact", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name, email, message })
            });

            alert("Message sent ✅");
        }
    </script>
</body>

</html>
