<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Soumyadip Store</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(-45deg, #ff6a00, #ff4d4d, #667eea, #764ba2);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes bgMove {
            0% {background-position: 0% 50%;}
            50% {background-position: 100% 50%;}
            100% {background-position: 0% 50%;}
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .box {
            width: min(360px, calc(100vw - 32px));
            background: #e6e6e6;
            padding: 32px 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: auto;
        }

        .brand-logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
        }

        .brand-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            padding: 0;
            border: none;
            box-shadow: none;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .brand-logo-badge:hover {
            transform: scale(1.04);
        }

        .brand-logo-img {
            height: 48px;
            max-width: 195px;
            width: auto;
            object-fit: contain;
            display: block;
        }

        h3 {
            margin-top: 4px;
            margin-bottom: 16px;
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.3px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #ff4d4d;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff4d4d;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background: #e60000;
        }

        .box p {
            margin-top: 15px;
            font-size: 13.5px;
            color: #555;
        }

        .box a {
            color: #ff4d4d;
            text-decoration: none;
            font-weight: 600;
        }

        .box a:hover {
            text-decoration: underline;
        }

        .box > a {
            display: inline-block;
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="brand-logo-container">
        <a href="index.html" class="brand-logo-badge" title="Soumyadip Store">
            <img src="/images/logo-transparent.png" alt="Soumyadip Store" class="brand-logo-img" onerror="if(!this.src.endsWith('images/logo-transparent.png')) this.src='images/logo-transparent.png';">
        </a>
    </div>

    <h3>Login</h3>

    <input type="text" id="userInput" placeholder="Enter Email or Phone">

    <input type="password" id="password" placeholder="Enter Password" style="display:none;">
    <input type="text" id="otp" placeholder="Enter OTP" style="display:none;">

    <button id="sendOtpBtn" onclick="sendOTP()" style="display:none;">Send OTP</button>

    <button onclick="login()">Login</button>

    <p>Don't have account? <a href="register.html">Register</a></p>
    <a href="forgot.html">Forgot Password?</a>

</div>

<script>
const input = document.getElementById("userInput");
const passwordInput = document.getElementById("password");
const otpInput = document.getElementById("otp");
const sendOtpBtn = document.getElementById("sendOtpBtn");

const BASE_URL = ""; // backend

// 🔍 Detect email or phone
input.addEventListener("input", () => {
    const value = input.value;

    if (value.includes("@")) {
        passwordInput.style.display = "block";
        otpInput.style.display = "none";
        sendOtpBtn.style.display = "none";
    } 
    else if (value.length >= 10) {
        passwordInput.style.display = "none";
        otpInput.style.display = "block";
        sendOtpBtn.style.display = "block";
    } 
    else {
        passwordInput.style.display = "none";
        otpInput.style.display = "none";
        sendOtpBtn.style.display = "none";
    }
});

// 🔥 SEND OTP (FIXED ROUTE)
async function sendOTP() {
    try {
        const res = await fetch(BASE_URL + "/api/users/send-otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone: input.value })
        });

        const text = await res.text();
        let data = {};
        try { data = JSON.parse(text); } catch(e) {}

        if (!res.ok) {
            alert(data.msg || data.error || ("Server Error (" + res.status + "): " + text.substring(0, 100)));
            return;
        }

        alert(data.msg || data.message || "OTP sent ✅");

    } catch (err) {
        alert("❌ Network Error: " + err.message);
    }
}

// 🔥 LOGIN (FIXED ROUTES)
async function login() {
    const value = input.value.trim();

    if (!value) {
        alert("Please enter your email or phone number ❌");
        return;
    }

    try {
        let res;
        if (value.includes("@")) {
            // EMAIL LOGIN
            const password = passwordInput.value;
            if (!password) {
                alert("Please enter your password ❌");
                return;
            }
            res = await fetch(BASE_URL + "/api/users/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    email: value,
                    password: password
                })
            });
        } else {
            // OTP LOGIN
            const otp = otpInput.value;
            if (!otp) {
                alert("Please enter your OTP ❌");
                return;
            }
            res = await fetch(BASE_URL + "/api/users/verify-otp", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    phone: value,
                    otp: otp
                })
            });
        }

        const text = await res.text();
        let data = {};
        try { data = JSON.parse(text); } catch(e) {}

        // 🔄 Serverless Session Resilience: If this serverless container didn't have the user in memory,
        // check if this user previously registered on this device and re-sync automatically!
        if (!res.ok && value.includes("@") && data.msg && data.msg.includes("Account not found")) {
            try {
                const regAccounts = JSON.parse(localStorage.getItem("registeredAccounts") || "[]");
                const matched = regAccounts.find(a => a.email.toLowerCase() === value.toLowerCase());
                if (matched && matched.password === passwordInput.value) {
                    await fetch(BASE_URL + "/api/users/register", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: value, password: matched.password })
                    });

                    res = await fetch(BASE_URL + "/api/users/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: value, password: matched.password })
                    });

                    const retryText = await res.text();
                    try { data = JSON.parse(retryText); } catch(e) {}
                }
            } catch (syncErr) {
                console.warn("Sync error:", syncErr);
            }
        }

        if (!res.ok) {
            alert(data.msg || data.error || ("Login failed (" + res.status + "): " + (text.substring(0, 150) || "Error")));
            return;
        }

        const isAdmin = data.user && (data.user.role === "admin" || data.user.isAdmin === true);

        // ✅ Save general user info
        localStorage.setItem("user", JSON.stringify(data.user));
        localStorage.setItem("token", data.token);

        // ✅ If admin, synchronize admin session tokens
        if (isAdmin) {
            localStorage.setItem("adminToken", data.token);
            localStorage.setItem("adminRole", "admin");
            localStorage.setItem("adminEmail", data.user.email || value);
            alert("👑 Admin login success! Welcome Administrator.");
        } else {
            alert(data.msg || "Login success ✅");
        }

        window.location.href = "products.html";

    } catch (err) {
        alert("❌ Network Error: " + err.message);
    }
}
</script>

</body>
</html>
