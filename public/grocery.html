<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fresh Grocery</title>

<style>
body{
margin:0;
font-family:"Segoe UI",sans-serif;
background:linear-gradient(135deg,#d4fc79,#96e6a1);
min-height:100vh;
}

/* NAVBAR */
.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 30px;
background:rgba(46,125,50,0.9);
backdrop-filter:blur(15px);
box-shadow:0 8px 25px rgba(0,0,0,0.15);
position:sticky;
top:0;
z-index:1000;
}

.navbar h2{
margin:0;
font-size:35px;
color:white;
}

.navbar input{
width:45%;
padding:12px 20px;
border:none;
outline:none;
border-radius:50px;
background:rgba(255,255,255,0.85);
font-size:16px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.navbar nav a{
margin-left:15px;
color:white;
text-decoration:none;
font-size:18px;
transition:.3s;
}

.navbar nav a:hover{
color:#ffeb3b;
}

.cart{
font-size:22px;
font-weight:bold;
cursor:pointer;
}

/* HERO */
.hero{
margin:25px;
border-radius:30px;
height:350px;
display:flex;
align-items:center;
padding-left:60px;
color:white;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url('https://images.unsplash.com/photo-1542838132-92c53300491e')
center/cover;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
animation:fadeIn 1s ease;
}

.hero h1{
font-size:60px;
margin:0;
}

.hero p{
font-size:22px;
}

/* CATEGORY */
.category-cards{
display:flex;
justify-content:center;
gap:20px;
margin:30px;
flex-wrap:wrap;
}

.cat{
background:rgba(255,255,255,.45);
backdrop-filter:blur(10px);
padding:15px 30px;
border-radius:30px;
cursor:pointer;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.4s;
}

.cat.active{
background:#2e7d32;
color:white;
}

.cat:hover{
transform:translateY(-5px);
}

/* PRODUCTS */
.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:25px;
padding:25px;
}

/* PRODUCT CARD */
.product{
background:rgba(255,255,255,.7);
backdrop-filter:blur(12px);
border-radius:20px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.12);
transition:.4s;
position:relative;
}

.product:hover{
transform:translateY(-12px) scale(1.03);
box-shadow:0 20px 35px rgba(0,0,0,.2);
}

.product img{
width:100%;
height:220px;
object-fit:cover;
transition:.4s;
}

.product:hover img{
transform:scale(1.08);
}

.product h3{
margin:12px;
font-size:20px;
}

.product p{
margin:0 12px;
color:#2e7d32;
font-weight:bold;
font-size:18px;
}

.product button{
margin:12px;
width:calc(100% - 24px);
background:linear-gradient(90deg,#00c853,#64dd17);
border:none;
padding:12px;
color:white;
font-size:15px;
font-weight:bold;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.product button:hover{
transform:scale(1.05);
box-shadow:0 5px 15px rgba(0,200,83,.4);
}

/* BADGE */
.badge{
position:absolute;
top:10px;
left:10px;
background:#ff3d00;
color:white;
padding:6px 10px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}

/* EMPTY */
.empty{
text-align:center;
font-size:24px;
padding:60px;
font-weight:bold;
color:#444;
}

/* TOAST */
.toast{
position:fixed;
bottom:30px;
right:30px;
background:#2e7d32;
color:white;
padding:15px 25px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
z-index:9999;
animation:fadeIn .4s ease;
}

/* ANIMATION */
@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* MOBILE */
@media(max-width:768px){

.navbar{
flex-direction:column;
gap:15px;
}

.navbar input{
width:90%;
}

.hero{
height:260px;
padding-left:25px;
}

.hero h1{
font-size:35px;
}

.hero p{
font-size:16px;
}

.products{
grid-template-columns:1fr;
}
}
</style>
</head>
<body>

<header class="navbar">
  <h2>FreshMart 🥬</h2>
  <input type="text" id="search" placeholder="Search fresh groceries...">
  <div class="cart" onclick="goToCart()" style="cursor:pointer;">
  🛒 Cart: <span id="cartCount">0</span>
</div>
    <nav>
    <a href="index.html">Home</a>
    <a href="grocery.html">Grocery</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<section class="hero">
  <div>
    <h1>Fresh Grocery Delivered</h1>
    <p>Best quality products at lowest prices</p>
  </div>
</section>

<div class="category-cards">
  <div class="cat active" onclick="filterType('all', this)">All</div>
  <div class="cat" onclick="filterType('rice', this)">🍚 Rice</div>
  <div class="cat" onclick="filterType('dairy', this)">🥛 Dairy</div>
  <div class="cat" onclick="filterType('fruits', this)">🍎 Fruits</div>
</div>

<section class="products" id="products"></section>

<script>
let allProducts = [];
let filtered = [];

// FETCH DATA
fetch("/api/products")
  .then(res => res.json())
  .then(data => {
    allProducts = data.filter(item => item.category === "grocery");
    filtered = [...allProducts];
    displayProducts(filtered);
  });

// DISPLAY
function displayProducts(data) {
  const container = document.getElementById("products");
  container.innerHTML = "";

  if (data.length === 0) {
    container.innerHTML = "<div class='empty'>No Items Found ❌</div>";
    return;
  }

  data.forEach(item => {
    const div = document.createElement("div");
    div.className = "product";

    div.innerHTML = `
      <div class="badge">Fresh</div>
      <img src="${item.img}">
      <h3>${item.name}</h3>
      <p>₹${item.price}</p>
     <button onclick="addToCart('${item.name}',${item.price},'${item.img}')">Add to Cart</button>
    `;

    container.appendChild(div);
  });
}

// SEARCH
document.getElementById("search").addEventListener("input", (e)=>{
  const text = e.target.value.toLowerCase();
  const result = filtered.filter(p =>
    p.name.toLowerCase().includes(text)
  );
  displayProducts(result);
});

// CATEGORY FILTER
function filterType(type, el) {
  document.querySelectorAll(".cat").forEach(c => c.classList.remove("active"));
  el.classList.add("active");

  if (type === "all") {
    filtered = [...allProducts];
  } else {
    filtered = allProducts.filter(p => p.type === type);
  }

  displayProducts(filtered);
}

// CART SYSTEM
function addToCart(name, price, img) {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push({ name, price, img });

  localStorage.setItem("cart", JSON.stringify(cart));

  updateCart();

  // 🔥 better UX
  showToast(name + " added to cart 🛒");
}

// UPDATE CART COUNT
function updateCart() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cartCount").innerText = cart.length;
}

updateCart();

</script>
</body>
</html>
